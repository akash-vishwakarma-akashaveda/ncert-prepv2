# AWS Amplify Hosting response headers. Amplify reads this file from the app root (frontend/) of
# this monorepo app; the customHeaders block that used to sit in ../amplify.yml was not applied.
# Check after a deploy:  curl -sI https://ncertprep.planyt.in/
customHeaders:
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()
      # Only the hosts the app really uses: the API (+ its socket), YouTube (player API, frames,
      # thumbnails), Google Sign-In, Google Fonts, Google profile photos, and S3 for note files.
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' https://www.youtube.com https://s.ytimg.com https://accounts.google.com;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com;
          font-src 'self' data: https://fonts.gstatic.com;
          img-src 'self' data: blob: https://i.ytimg.com https://*.googleusercontent.com https://*.amazonaws.com;
          frame-src https://www.youtube.com https://accounts.google.com;
          connect-src 'self' https://ncertprepapi.planyt.in wss://ncertprepapi.planyt.in https://accounts.google.com https://www.googleapis.com https://*.amazonaws.com;
          worker-src 'self' blob:;
          object-src 'none';
          base-uri 'self';
          form-action 'self';
          frame-ancestors 'none';
          upgrade-insecure-requests
  # Hashed build files never change, so browsers may keep them for a year.
  - pattern: '/assets/**'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # The HTML shell must always be fresh so a new release shows up straight away.
  - pattern: '/index.html'
    headers:
      - key: Cache-Control
        value: no-cache
